# Chicago-Wayland Classic MS-DOS Prompt / Windows 95 Terminal Config (Kitty)
# Optimized for zero idle redraws (cursor_blink_interval 0) and classic VGA palette

font_family      monospace
font_size        10.5
cursor_shape     underline
cursor_blink_interval 0
enable_audio_bell no
window_padding_width 2
confirm_os_window_close 0
linux_display_server wayland
hide_window_decorations no

# Classic MS-DOS / Windows 95 VGA Color Palette
background #000000
foreground #c0c0c0
selection_background #000080
selection_foreground #ffffff
cursor #c0c0c0

color0  #000000
color8  #808080
color1  #800000
color9  #ff0000
color2  #008000
color10 #00ff00
color3  #808000
color11 #ffff00
color4  #000080
color12 #0000ff
color5  #800080
color13 #ff00ff
color6  #008080
color14 #00ffff
color7  #c0c0c0
color15 #ffffff
