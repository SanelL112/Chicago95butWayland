# Chicago-Wayland Authentic MS-DOS Prompt (Kitty Config)
# Uses Chicago95's 'More Perfect DOS VGA' pixel font and opaque VGA palette

font_family          More Perfect DOS VGA
bold_font            More Perfect DOS VGA
italic_font          More Perfect DOS VGA
bold_italic_font     More Perfect DOS VGA
font_size            12.0

cursor_shape          underline
cursor_blink_interval 0
cursor_trail          0

background_opacity    1.0
background_blur       0
remember_window_size  no
initial_window_width  680
initial_window_height 440
window_margin_width   0
window_padding_width  4
placement_strategy    top-left

enable_audio_bell        no
confirm_os_window_close  0
linux_display_server     wayland
hide_window_decorations  no

# Classic MS-DOS / Windows 95 VGA Color Palette
background           #000000
foreground           #c0c0c0
selection_background #000080
selection_foreground #ffffff
cursor               #c0c0c0
cursor_text_color    #000000

color0  #000000
color8  #808080
color1  #aa0000
color9  #ff5555
color2  #00aa00
color10 #55ff55
color3  #aa5500
color11 #ffff55
color4  #0000aa
color12 #5555ff
color5  #aa00aa
color13 #ff55ff
color6  #00aaaa
color14 #55ffff
color7  #c0c0c0
color15 #ffffff
